<div class="modal fade" id="taskFormModal" tabindex="-1" aria-labelledby="taskFormModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-lg">
    <div class="modal-content create-task-card">

      <div class="d-flex justify-content-between align-items-center mb-4">

        <h4 class="m-0 fw-bold text-dark" id="taskFormModalLabel">Crear tarea</h4>

        <button type="button" class="create-task-card__header-btn" data-bs-dismiss="modal" aria-label="Cerrar">
          <i class="bi bi-x-lg"></i>
        </button>
      </div>

      <form class="create-task-form" id="createTaskForm">

        <div class="row g-3 mb-3">

          <div class="col-12 col-md-9">
            <label for="taskName" class="create-task-form__label">
              Título
            </label>
            <input type="text" class="form-control create-task-form__input" id="taskName"
              placeholder="Ingresa el título de la tarea">
          </div>

          <div class="col-12 col-md-3">
            <label class="create-task-form__label">
              Estado
            </label>

            <div class="dropdown">

              <button class="btn task-status w-100 justify-content-between dropdown-toggle" type="button"
                id="taskStatusToggle" data-status="pending" data-bs-toggle="dropdown" aria-expanded="false">
                Pendiente
              </button>

              <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" href="#" data-status="pending">Pendiente</a></li>
                <li><a class="dropdown-item" href="#" data-status="in-progress">En progreso</a></li>
                <li><a class="dropdown-item" href="#" data-status="blocked">Bloqueado</a></li>
                <li><a class="dropdown-item" href="#" data-status="paused">En pausa</a></li>
                <li><a class="dropdown-item" href="#" data-status="done">Completada</a></li>
              </ul>
            </div>
          </div>
        </div>

        <div class="mb-3">
          <label for="taskDescription" class="create-task-form__label">
            Descripción
          </label>
          <div class="create-task-form__description">
            <textarea id="taskDescription" class="form-description"
              placeholder="Ingresa la descripción de la tarea"></textarea>
          </div>
        </div>

        <div class="row g-3 mb-3">

          <div class="col-md-6">
            <label class="create-task-form__label" for="assigneeToggle">Asignado a</label>

            <div class="dropdown assignee-select">
              <button class="btn assignee-select__toggle w-100 dropdown-toggle" type="button"
                id="assigneeToggle" data-bs-toggle="dropdown" aria-expanded="false">
                <span class="assignee-select__placeholder">
                  <i class="bi bi-person"></i>
                  <span>Selecciona una persona</span>
                </span>
              </button>

              <ul class="dropdown-menu assignee-select__menu" id="assigneeMenu"
                aria-labelledby="assigneeToggle"></ul>
            </div>
          </div>

          <div class="col-md-6">
            <label for="deadline" class="create-task-form__label">Fecha límite</label>

            <input type="text" class="form-control create-task-form__input" id="deadline"
              placeholder="dd/mm/aaaa" autocomplete="off">
          </div>
        </div>

        <div class="row g-3 mb-3">

          <div class="col-md-6">
            <label for="epic" class="create-task-form__label">Prioridad</label>
            <select class="form-select" id="epic">
              <option selected disabled hidden>Selecciona la prioridad</option>
              <option value="1">Alta</option>
              <option value="2">Media</option>
              <option value="3">Baja</option>
            </select>
          </div>

          <div class="col-md-6">
            <label for="tags" class="create-task-form__label">Etiquetas</label>

            <select class="form-select" id="tags">
              <option selected disabled hidden>Selecciona etiquetas</option>
              <option value="frontend">Frontend</option>
              <option value="backend">Backend</option>
              <option value="bug">Bug</option>
            </select>
          </div>
        </div>

        <div class="d-flex justify-content-end gap-2 pt-2">

          <button type="button" class="btn create-task-form__btn create-task-form__btn--cancel"
            data-bs-dismiss="modal">
            Cancelar
          </button>

          <button type="submit" class="btn create-task-form__btn create-task-form__btn--create">
            Crear
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
