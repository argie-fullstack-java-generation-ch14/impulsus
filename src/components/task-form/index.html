<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../../css/global.css">
  <link rel="stylesheet" href="./task-form.css">
</head>

<body>

  <div class="create-task">
    <div class="create-task-card">

      <div class="d-flex justify-content-between align-items-center mb-4">

        <h4 class="m-0 fw-bold text-dark">Crear tarea</h4>

        <div class="d-flex align-items-center gap-3">
          <i class="bi bi-arrows-angle-expand create-task-card__header-btn" title="Expandir">
          </i>
          <i class="bi bi-x-lg create-task-card__header-btn" title="Cerrar">
          </i>
        </div>
      </div>

      <form class="create-task-form">

        <div class="row g-3 mb-3">

          <div class="col-12 col-md-9">
            <label for="taskName" class="create-task-form__label">
              Título
            </label>
            <input type="text" class="form-control create-task-form__input" id="taskName"
              placeholder="Ingresa el título de la tarea">
          </div>

          <div class="col-12 col-md-3">
            <label class="create-task-form__label">
              Estado
            </label>

            <div class="dropdown">

              <button class="btn task-status w-100 justify-content-between dropdown-toggle" type="button"
                data-bs-toggle="dropdown" aria-expanded="false">
                Pendiente
              </button>

              <ul class="dropdown-menu dropdown-menu-end">
                <li><a class="dropdown-item" href="#">Pendiente</a></li>
                <li><a class="dropdown-item" href="#">En progreso</a></li>
                <li><a class="dropdown-item" href="#">Bloqueada</a></li>
                <li><a class="dropdown-item" href="#">Completada</a></li>
              </ul>
            </div>
          </div>
        </div>

        <div class="mb-3">
          <label for="taskDescription" class="create-task-form__label">
            Descripción
          </label>
          <div class="create-task-form__description">
            <textarea id="taskDescription" class="form-description"
              placeholder="Ingresa la descripción de la tarea"></textarea>
          </div>
        </div>

        <div class="row g-3 mb-3">

          <div class="col-md-6">
            <label for="assignee" class="create-task-form__label">Asignado a</label>

            <div class="input-group input-asignee">
              <span class="input-group-text bg-transparent border-0 pe-1" id="assignee-addon">
                <i class="bi bi-person text-secondary"></i>
              </span>
              <input type="text" class="form-control bg-transparent border-0 ps-1 shadow-none" id="assignee"
                placeholder="Nombre" aria-describedby="assignee-addon">
            </div>
          </div>

          <div class="col-md-6">
            <label for="deadline" class="create-task-form__label">Fecha límite</label>

            <select class="form-select" id="deadline">
              <option selected disabled hidden>Selecciona la fecha</option>
              <option value="1">Hoy</option>
              <option value="2">Mañana</option>
              <option value="3">Próxima semana</option>
            </select>
          </div>
        </div>

        <div class="row g-3 mb-3">

          <div class="col-md-6">
            <label for="epic" class="create-task-form__label">Prioridad</label>
            <select class="form-select" id="epic">
              <option selected disabled hidden>Selecciona la prioridad</option>
              <option value="1">Alta</option>
              <option value="2">Media</option>
              <option value="3">Baja</option>
            </select>
          </div>

          <div class="col-md-6">
            <label for="tags" class="create-task-form__label">Etiquetas</label>

            <select class="form-select" id="tags">
              <option selected disabled hidden>Selecciona etiquetas</option>
              <option value="frontend">Frontend</option>
              <option value="backend">Backend</option>
              <option value="bug">Bug</option>
            </select>
          </div>
        </div>

        <div class="d-flex justify-content-end gap-2 pt-2">

          <button type="button" class="btn create-task-form__btn create-task-form__btn--cancel">
            Cancelar
          </button>

          <button type="submit" class="btn create-task-form__btn create-task-form__btn--create">
            Crear
          </button>
        </div>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
